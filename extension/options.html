<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Costco Price Watcher – Settings</title>
    <style>
      :root { color-scheme: light dark; --muted: #6b7280; --ok: #15803d; --bad: #b91c1c; }
      body { font: 14px/1.5 -apple-system, system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      button { font: inherit; padding: 4px 12px; cursor: pointer; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
      #status { margin-top: 12px; min-height: 1.5em; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      section { margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>Costco Price Watcher</h1>
    <label for="url">Local service address</label>
    <input id="url" type="text" spellcheck="false" />
    <div class="hint">Where <code>npm start</code> is running. Default: http://127.0.0.1:4000</div>
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test connection</button>
    </div>
    <div id="status"></div>
    <section>
      <label><input id="close-tabs" type="checkbox" style="width:auto" /> Close tabs opened by “Check all” after their price is saved</label>
      <div class="hint">Tabs you open yourself are never closed. Tabs where no price was found stay open so you can look.</div>
    </section>
    <section>
      <label>Waiting to be sent</label>
      <div><span id="queued">–</span> price(s) captured while the service wasn't reachable.</div>
      <div class="row"><button id="flush">Send now</button></div>
    </section>
    <script src="dist/options.js"></script>
  </body>
</html>
